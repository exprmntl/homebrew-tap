name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register checked-out tap
        run: brew tap exprmntl/tap "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict --formula exprmntl/tap/codex-update-helper
      - name: Check style
        run: brew style exprmntl/tap/codex-update-helper
